name: Grade 7 Review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  grade7:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 16111833
          packages: platform-tools
      - name: Install compile SDK
        run: |
          sdkmanager "platforms;android-37" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
      - name: Validate all Grade 7 questions and source images
        run: python3 scripts/validate_grade7.py
      - name: Assemble Grade 7 review app
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Upload installable Grade 7 APK
        uses: actions/upload-artifact@v4
        with:
          name: OloomYar7-Chapters1-2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the actual Persian Grade 7 UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell settings put global hide_error_dialogs 1
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.oloomyar.app.Grade7WorkbookUiTest --stacktrace
            adb pull /sdcard/Download/grade7-screenshots app/build/grade7-screenshots
      - name: Upload Grade 7 test reports and real screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OloomYar7-UI-Reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/test-results/testDebugUnitTest/
            app/build/grade7-screenshots/
            qa/grade7_content_validation.json
