name: Grade 7 Review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  grade7:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 16111833
          packages: platform-tools
      - name: Install compile SDK
        run: |
          sdkmanager "platforms;android-37" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
      - name: Install source audit tools
        run: python3 -m pip install PyMuPDF==1.26.6 Pillow==11.3.0 numpy==2.2.6 scipy==1.15.3
      - name: Validate all Grade 7 questions and source images
        run: python3 scripts/validate_grade7.py
      - name: Install emulator image with the selected Android command line tools
        run: '"$ANDROID_SDK_ROOT/cmdline-tools/16111833/bin/sdkmanager" "emulator" "system-images;android-35;google_apis;x86_64"'
      - name: Assemble Grade 7 review app
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:bundleRelease --stacktrace
      - name: Verify packaged source size and absence of duplicate PNGs
        run: python3 scripts/check_apk_package.py
      - name: Build the previous signed review for real update verification
        run: |
          GRADE7_BASELINE_PROJECT="$RUNNER_TEMP/grade7-upgrade-baseline"
          git worktree add --detach "$GRADE7_BASELINE_PROJECT" 3c9001107f347a354570a9815709a3d7f09623a0
          cp local.properties "$GRADE7_BASELINE_PROJECT/local.properties"
          chmod +x "$GRADE7_BASELINE_PROJECT/gradlew"
          "$GRADE7_BASELINE_PROJECT/gradlew" -p "$GRADE7_BASELINE_PROJECT" --no-daemon :app:assembleDebug
          mkdir -p app/build/upgrade
          cp "$GRADE7_BASELINE_PROJECT/app/build/outputs/apk/debug/app-debug.apk" app/build/upgrade/grade7_0.11.0.apk
      - name: Upload installable Grade 7 APK
        uses: actions/upload-artifact@v4
        with:
          name: OloomYar7-1405-All15-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned release bundle for production signing
        uses: actions/upload-artifact@v4
        with:
          name: OloomYar7-0.14-Unsigned-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the actual Persian Grade 7 UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/run_ui_review.sh
      - name: Upload Grade 7 test reports and real screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OloomYar7-UI-Reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/test-results/testDebugUnitTest/
            app/build/grade7-screenshots/
            app/build/persistence-verification/
            qa/grade7_content_validation.json
            qa/grade7_native_content_validation.json
            qa/android_package_size.json
            qa/source/image-optimization-v10.json
            qa/source/image-optimization-v11.json
            qa/source/original-tables-v11.json
            qa/all-chapters-editorial-review-v10.json
            qa/practice-distractors-review.json
            qa/source/native-editorial-revisions-v14.json
  cleanup-merged-grade7-branches:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'nranjbar/oloomyar7'
    needs: grade7
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove only branch tips already contained in verified main
        run: python3 scripts/cleanup_merged_grade7_branches.py
